<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-body">

            <!-- PAGE TITLE (TC1) -->
            <h3 id="page-title" class="mb-4 text-center">
                📝 Smart Task Manager
            </h3>

            <!-- ADD TASK (TC2) -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <input
                        id="task-title"
                        class="form-control"
                        placeholder="Enter task title">
                </div>

                <div class="col-md-4">
                    <select id="priority-select" class="form-select">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <button
                        id="add-task-btn"
                        class="btn btn-success w-100">
                        Add
                    </button>
                </div>
            </div>

            <!-- FILTERS (TC4) -->
            <div class="mb-3 text-center">
                <button
                    id="filter-all"
                    class="btn btn-outline-primary btn-sm"
                    onclick="loadTasks()">
                    All
                </button>

                <button
                    id="filter-completed"
                    class="btn btn-outline-success btn-sm"
                    onclick="loadTasks('completed')">
                    Completed
                </button>

                <button
                    id="filter-active"
                    class="btn btn-outline-warning btn-sm"
                    onclick="loadTasks('active')">
                    Active
                </button>
            </div>

            <!-- TASK LIST -->
            <ul id="task-list" class="list-group"></ul>

            <!-- COUNTERS -->
            <p class="mt-3 text-center">
                Total: <span id="total-count">0</span> |
                Completed: <span id="completed-count">0</span>
            </p>

        </div>
    </div>
</div>

<script>
async function loadTasks(filter = "") {
    let url = "/api/tasks";
    if (filter) {
        url += "?status=" + filter;
    }

    const response = await fetch(url);
    const tasks = await response.json();

    const list = document.getElementById("task-list");
    list.innerHTML = "";

    // Kullanıcı girdisini HTML'e basmadan önce kaçışla (XSS önlemi)
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, c =>
        ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

    let completedCounter = 0;

    tasks.forEach(task => {
        if (task.completed) completedCounter++;

        const li = document.createElement("li");
        li.className =
            "list-group-item d-flex justify-content-between align-items-center";

        li.innerHTML = `
            <div>
                <input
                    type="checkbox"
                    class="form-check-input me-2 task-checkbox"
                    ${task.completed ? "checked" : ""}>

                <span
                    class="task-title"
                    style="${task.completed ? "text-decoration: line-through;" : ""}">
                    ${escapeHtml(task.title)}
                </span>

                <span class="badge bg-secondary ms-2">
                    ${escapeHtml(task.priority)}
                </span>
            </div>

            <button class="btn btn-danger btn-sm delete-btn">
                Delete
            </button>
        `;

        // TC3 – Complete Task
        li.querySelector(".task-checkbox").onchange = () => {
            updateTask(task.id, { completed: !task.completed });
        };

        // TC5 – Delete Task
        li.querySelector(".delete-btn").onclick = () => {
            deleteTask(task.id);
        };

        list.appendChild(li);
    });

    document.getElementById("total-count").innerText = tasks.length;
    document.getElementById("completed-count").innerText = completedCounter;
}

// ADD TASK
async function addTask() {
    const titleInput = document.getElementById("task-title");
    const prioritySelect = document.getElementById("priority-select");

    if (!titleInput.value.trim()) return;

    await fetch("/api/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            title: titleInput.value,
            priority: prioritySelect.value
        })
    });

    titleInput.value = "";
    loadTasks();
}

// UPDATE TASK
async function updateTask(id, data) {
    await fetch(`/api/tasks/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });
    loadTasks();
}

// DELETE TASK
async function deleteTask(id) {
    await fetch(`/api/tasks/${id}`, {
        method: "DELETE"
    });
    loadTasks();
}

document.getElementById("add-task-btn").onclick = addTask;
loadTasks();
</script>

</body>
</html>
